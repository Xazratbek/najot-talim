services:
  web:
    build:
      context: .
    ports:
      - "${APP_PORT:-8001}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:-auth}@db:5432/${POSTGRES_DB:-auth}
      SECRET_KEY: ${SECRET_KEY:-yettinchi-dars-super-secret-key-change-me}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth}
      POSTGRES_USER: ${POSTGRES_USER:-auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
