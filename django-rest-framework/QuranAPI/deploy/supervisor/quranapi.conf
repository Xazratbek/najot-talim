[program:quranapi]
directory=/var/www/quranapi
command=/var/www/quranapi/venv/bin/gunicorn config.wsgi:application -c /var/www/quranapi/gunicorn.conf.py
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/quranapi/supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=DJANGO_SETTINGS_MODULE="config.settings"
