services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_navbat}
      POSTGRES_USER: ${POSTGRES_USER:-smart_navbat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_navbat}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      - db
    ports:
      - "8000:8000"

  bot:
    build: ./bot_service
    env_file: .env
    environment:
      DJANGO_API_BASE_URL: http://backend:8000/api
    depends_on:
      - backend
    ports:
      - "8001:8001"

volumes:
  db_data:
